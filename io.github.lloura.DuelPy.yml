app-id: io.github.lloura.DuelPy
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: duelpy

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - "*.la"
  - "*.a"

modules:
  - name: duelpy
    buildsystem: meson
    sources:
      - type: dir
        path: .